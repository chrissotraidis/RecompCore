name: Staging copy plan

on:
  pull_request:
    paths:
      - ".github/workflows/staging-copy-plan.yml"
      - "GXRuntime/graphics/aurora/lib/gfx/common.cpp"
      - "GXRuntime/graphics/aurora/lib/gfx/staging_copy_plan.hpp"
      - "GXRuntime/graphics/aurora/tests/CMakeLists.txt"
      - "GXRuntime/graphics/aurora/tests/staging_copy_plan_test.cpp"
  push:
    branches: [bluewake-next]
    paths:
      - ".github/workflows/staging-copy-plan.yml"
      - "GXRuntime/graphics/aurora/lib/gfx/common.cpp"
      - "GXRuntime/graphics/aurora/lib/gfx/staging_copy_plan.hpp"
      - "GXRuntime/graphics/aurora/tests/CMakeLists.txt"
      - "GXRuntime/graphics/aurora/tests/staging_copy_plan_test.cpp"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile staging-copy plan test
        run: >-
          c++ -std=c++20 -Wall -Wextra -Werror
          -IGXRuntime/graphics/aurora/lib
          GXRuntime/graphics/aurora/tests/staging_copy_plan_test.cpp
          -o staging_copy_plan_test
      - name: Test default and opt-in copy ordering
        run: ./staging_copy_plan_test
